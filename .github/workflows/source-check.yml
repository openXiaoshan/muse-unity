name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 Tools~/audit.py
      - run: python3 -m compileall -q Tools~
  macos-native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: python3 Tools~/build_native.py --mac
